name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install aapt2 to /usr/bin
        run: |
          AAPT2_PATH=$(find $ANDROID_HOME -name "aapt2" -type f 2>/dev/null | head -1)
          if [ -n "$AAPT2_PATH" ]; then
            sudo cp "$AAPT2_PATH" /usr/bin/aapt2
            sudo chmod +x /usr/bin/aapt2
            echo "aapt2 installed from $AAPT2_PATH"
          else
            echo "aapt2 not found in SDK, downloading..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-android-build-tools-installer 2>/dev/null || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}